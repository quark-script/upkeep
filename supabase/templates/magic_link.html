<!--
  Sign-in is a typed 6-digit code, not a link: on iOS a magic link opens in
  Safari, whose storage sandbox the standalone PWA cannot see, so a session
  created there is invisible to the installed app.

  This template therefore prints `{{ .Token }}` and deliberately omits
  `{{ .ConfirmationURL }}` — offering both would let a tap consume the token
  and strand the sign-in half-finished.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 420px; margin: 0 auto; padding: 32px 24px; color: #111;">
  <h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 600;">Sign in to Upkeep</h2>
  <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.5; color: #555;">
    Enter this code in the app to finish signing in.
  </p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 700; letter-spacing: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
    {{ .Token }}
  </p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #888;">
    The code expires in an hour. If you didn't ask to sign in, ignore this email.
  </p>
</div>
